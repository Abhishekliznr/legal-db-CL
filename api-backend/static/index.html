<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Backend | Liznr Legal</title>
  <style>
    :root {
      --bg: black;
      --card: black;
      --border: black;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --up: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 3rem;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--up);
      font-weight: 500;
      margin: 1rem 0 1.5rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--up);
      box-shadow: 0 0 8px var(--up);
    }

    p.desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    a.link {
      display: block;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      transition: border-color 0.15s, color 0.15s;
    }

    a.link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>⚙️ Liznr Legal — API Backend</h1>
    <div class="status"><span class="dot"></span> Backend is up and running</div>
    <p class="desc">Case search, filters & citator API service.</p>
    <div class="links">
      <a class="link" href="/docs">📖 API Documentation (Swagger)</a>
    </div>
  </div>
</body>

</html>
