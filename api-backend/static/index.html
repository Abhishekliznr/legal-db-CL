<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/static/favicon.ico" type="image/favicon">

  <title>Liznr Legal — API Backend</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
    }

    .subtitle {
      margin: 8px 0 28px;
      color: #888;
      font-size: 15px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      color: #22c55e;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link {
      display: block;
      padding: 13px 16px;
      border: 1px solid #27272a;
      border-radius: 50px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      background: #09090b;
      transition: border-color 0.2s, background 0.2s;
    }

    .link:hover {
      border-color: #7c3aed;
      background: #111113;
    }
  </style>
</head>

<body>

  <main id="app">

    <img src="/static/logo-icon.png" alt="Liznr Legal" class="logo">

    <h1>Liznr Legal</h1>

    <p class="subtitle">Case Research API Backend</p>

    <div class="status">
      <span class="status-dot"></span>
      <span>Backend is up and running</span>
    </div>

    <div class="links">

      <a href="/docs" class="link">
        📖 API Documentation (Swagger)
      </a>

      <a href="/health" class="link">
        💚 Health Check
      </a>

    </div>

  </main>

</body>

</html>
