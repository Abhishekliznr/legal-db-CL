services:
  # api-backend — case search, filters, stats & history (lightweight,
  # read-only). Points at the shared external Postgres via DB_HOST/DB_PORT
  # in .env instead of a bundled db container.
  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_api_v2_backend
    restart: always
    ports:
      - "8002:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/__pycache__
