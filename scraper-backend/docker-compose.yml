services:
  # scraper-backend worker — runs one batch and exits (heavy: Playwright/Chromium,
  # Tesseract, spaCy NER). No docker-internal Postgres: DB_HOST/DB_NAME/etc come
  # straight from .env. Batches are normally queued and launched by api-backend;
  # to run one by hand:
  #   docker compose run --rm scraper-worker python -m worker --batch-id 123
  #   docker compose run --rm scraper-worker python -m worker --court sc --from 2026-09-01 --to 2026-09-07
  scraper-worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["worker"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/__pycache__
