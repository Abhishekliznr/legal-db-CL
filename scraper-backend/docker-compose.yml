services:
  # scraper-backend — court scraping, AI metadata extraction & Azure Blob
  # sync (heavy: Playwright/Chromium). Points at the shared external
  # Postgres via DB_HOST/DB_PORT in .env instead of a bundled db container.
  scraper-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_scraper_v2_backend
    restart: always
    ports:
      - "8003:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/__pycache__
