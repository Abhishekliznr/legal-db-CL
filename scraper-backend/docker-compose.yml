services:
  # scraper-backend — court scraping, AI metadata extraction & Azure
  # Blob sync (heavy: Playwright/Chromium). No docker-internal Postgres:
  # DB_HOST/DB_NAME/etc come straight from .env (env_file below), so this
  # always talks to whichever Postgres is configured there, on every
  # environment — no divergent hardcoded overrides here.
  scraper-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_scraper_v2_backend
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:3000"
    volumes:
      - .:/app
      - /app/__pycache__
