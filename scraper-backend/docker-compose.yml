services:
  # 1. PostgreSQL Database Service — own instance for scraper-backend
  #    (exposed on host port 5433 so it can run alongside api-backend's
  #    own Postgres on 5432 without a port clash)
  db:
    image: postgres:15-alpine
    container_name: legal_scraper_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: legal_db
    ports:
      - "5433:5432"
    volumes:
      - scraper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d legal_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Scraper Backend — court scraping, AI metadata extraction & Azure Blob sync (heavy)
  scraper-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_scraper_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8001"
    environment:
      - DB_CONNECTION=postgresql://postgres:1234@db:5432/legal_db
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_CONTAINER_NAME=${AZURE_CONTAINER_NAME}
      - AZURE_PDF_CONTAINER_NAME=${AZURE_PDF_CONTAINER_NAME}
    volumes:
      - .:/app
      - /app/__pycache__

volumes:
  scraper_postgres_data:
